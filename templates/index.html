<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Price Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <header class="head">
        <p class="eyebrow">Model-Powered</p>
        <h1>Car Price Predictor</h1>
        <p class="sub">Enter vehicle features and get an instant predicted price.</p>
      </header>

      <form method="post" class="grid">
        <label>
          Year
          <input type="number" name="year" min="1980" max="2035" step="1" required value="{{ form_values['year'] }}" />
        </label>

        <label>
          Levy
          <input type="number" name="levy" min="0" step="1" required value="{{ form_values['levy'] }}" />
        </label>

        <label>
          Manufacturer
          <select name="manufacturer" required>
            {% for m in manufacturers %}
              <option value="{{ m }}" {% if form_values['manufacturer'] == m %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </label>

        <label>
          Category
          <select name="category" required>
            {% for c in categories %}
              <option value="{{ c }}" {% if form_values['category'] == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>

        <label>
          Fuel Type
          <select name="fuel" required>
            {% for f in fuels %}
              <option value="{{ f }}" {% if form_values['fuel'] == f %}selected{% endif %}>{{ f }}</option>
            {% endfor %}
          </select>
        </label>

        <label>
          Engine Volume
          <input type="number" name="engine_volume" min="0.1" max="10" step="0.1" required value="{{ form_values['engine_volume'] }}" />
        </label>

        <label>
          Mileage
          <input type="number" name="mileage" min="0" step="1" required value="{{ form_values['mileage'] }}" />
        </label>

        <label>
          Cylinders
          <input type="number" name="cylinders" min="1" max="16" step="1" required value="{{ form_values['cylinders'] }}" />
        </label>

        <button type="submit">Predict Price</button>
      </form>

      {% if prediction is not none %}
        <section class="result">
          <p>Estimated Price</p>
          <h2>${{ "{:,.0f}".format(prediction) }}</h2>
        </section>
      {% endif %}

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <section class="author-meta">
        <p><strong>Developer:</strong> Samuel Yaw King-Mensah</p>
        <p><strong>Index:</strong> 2526500357</p>
      </section>
    </section>
  </main>
</body>
</html>
